# CI: checks every push before it can be trusted.
#
# When it runs: on every push, to any branch (including Dependabot's PR
# branches), and manually ("Run workflow" in the Actions tab).
# What it runs: lint -> typecheck -> unit tests -> production build, on a fresh
# Ubuntu machine with the Node version from .nvmrc.
# If it fails: the commit gets a red X on GitHub, the Actions tab shows the
# failing step and its log, and GitHub sends an email.
# No secrets: the build uses placeholder values for the public Supabase/VAPID
# variables. Nothing here talks to Supabase, SAP or production.
name: CI

on:
  push:
  workflow_dispatch:

# A new push to the same branch cancels the previous, now outdated, run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# CI only needs to read the code.
permissions:
  contents: read

jobs:
  check:
    name: Lint + typecheck + tests + build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      NEXT_TELEMETRY_DISABLED: 1
      # Placeholders so `next build` can prerender pages. Not real values.
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY: ci-placeholder
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ci-placeholder

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        # `npm ci` installs exactly what is in package-lock.json.
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Typecheck (tsc)
        run: npm run typecheck

      - name: Unit tests (vitest)
        # Live SAP tests are skipped unless SAP_LIVE_TESTS=1 (never set here).
        run: npm run test:run

      - name: Build (next build)
        run: npm run build
